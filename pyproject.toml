#run 'python3 -m build' to build the project
#then run 'twine upload dist/*' to publish

[build-system]
requires = ["setuptools>=84.0", "toml"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pymasque"]
package-dir = {"" = "src"}

[project]
name = "pymasque"
version = "0.1.0"
license = "LGPL-3.0-or-later"
authors = [
  {name="ading2210"},
]
description = "A minimal implementation of a Cloudflare Warp MASQUE client in Python."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "niquests",
  "qh3",
  "cryptography",
  "platformdirs"
]

[project.optional-dependencies]
socks = [
  "asyncio-socks-server"
]

[project.urls]
Homepage = "https://github.com/MercuryWorkshop/pymasque"
Issues = "https://github.com/MercuryWorkshop/pymasque/issues"